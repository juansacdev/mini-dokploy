<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="355" y="20" width="170" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="49" text-anchor="middle" font-size="14" fill="#1f2328">Browser</text>

  <!-- Browser -> Traefik -->
  <line x1="440" y1="68" x2="440" y2="106" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="452" y="84" font-size="11" fill="#57606a">dokploy.127.0.0.1.sslip.io</text>
  <text x="452" y="99" font-size="11" fill="#57606a">app-&lt;id&gt;.127.0.0.1.sslip.io</text>

  <!-- Traefik -->
  <rect x="345" y="108" width="190" height="62" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="440" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Traefik</text>
  <text x="440" y="150" text-anchor="middle" font-size="11" fill="#57606a">:80 · routes by service labels</text>

  <!-- Traefik -> Mini-Dokploy -->
  <path d="M400,170 L255,226" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="268" y="202" font-size="10.5" fill="#0969da">Host(dokploy.*)</text>

  <!-- Traefik -> deployed apps -->
  <path d="M480,170 L655,226" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="556" y="202" font-size="10.5" fill="#0969da">Host(app-*.sslip.io)</text>

  <!-- Mini-Dokploy box -->
  <rect x="40" y="228" width="430" height="214" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="60" y="252" font-size="13" font-weight="700" fill="#1f2328">Mini-Dokploy · Next.js (Swarm service)</text>

  <rect x="58" y="266" width="184" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="287" font-size="11.5" font-weight="600" fill="#1f2328">UI</text>
  <text x="68" y="303" font-size="10" fill="#57606a">auth-gated form + table</text>

  <rect x="252" y="266" width="200" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="262" y="287" font-size="11.5" font-weight="600" fill="#1f2328">tRPC API</text>
  <text x="262" y="303" font-size="10" fill="#57606a">Better Auth + userId scoping</text>

  <rect x="58" y="328" width="184" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="349" font-size="11.5" font-weight="600" fill="#1f2328">orchestrator</text>
  <text x="68" y="365" font-size="10" fill="#57606a">shell out to docker / git</text>

  <rect x="252" y="328" width="200" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="262" y="349" font-size="11.5" font-weight="600" fill="#1f2328">SQLite (Drizzle)</text>
  <text x="262" y="365" font-size="10" fill="#57606a">users · sessions · deployments</text>

  <text x="60" y="406" font-size="10.5" fill="#57606a">mounts /var/run/docker.sock ▼</text>

  <!-- Deployed apps box -->
  <rect x="560" y="228" width="280" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="576" y="252" font-size="13" font-weight="700" fill="#1f2328">Deployed apps (Swarm services)</text>
  <rect x="578" y="268" width="244" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="590" y="293" font-size="11.5" fill="#1f2328">app-7fa2 · the user's container</text>
  <rect x="578" y="318" width="244" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="590" y="343" font-size="11.5" fill="#1f2328">app-3c1d · the user's container</text>

  <!-- Docker daemon -->
  <rect x="120" y="486" width="340" height="60" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="290" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Host Docker daemon</text>
  <text x="290" y="528" text-anchor="middle" font-size="11" fill="#57606a">builds images · runs services</text>

  <!-- orchestrator -> daemon -->
  <line x1="150" y1="380" x2="225" y2="484" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="36" y="452" font-size="10" fill="#57606a">git clone →</text>
  <text x="36" y="465" font-size="10" fill="#57606a">docker build →</text>
  <text x="36" y="478" font-size="10" fill="#57606a">service create</text>

  <!-- daemon -> deployed apps (creates) -->
  <path d="M460,512 C610,512 668,440 695,380" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="556" y="476" font-size="10.5" fill="#57606a">creates / runs the services</text>
</svg>
